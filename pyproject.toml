[build-system]
requires = [
    "meson-python>=0.16",
    "meson>=1.4",
    "ninja",
    "numpy>=2.0"
]
build-backend = "mesonpy"

[project]
name = "SELQIE"
version = "0.1.1"
description = "SELected Quantum Interacting Electrons Package"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0"
homepage = "https://github.com/violetedwards/SELQIE"

authors = [
    { name = "Violet Edwards", email = "ie4005@hw.ac.uk"}
]

dependencies = [
    "numpy>=2.0",
    "scipy",
    "pyscf"
]